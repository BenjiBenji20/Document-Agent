name: Document Agent Test Workflow

on:
    push:
        branches: [ "**" ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest

        environment: production

        # Global environment variables for all steps in this job
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          LOG_LEVEL: ${{ secrets.DEBUG }}
          SECRET_HEADER_NAME: ${{ secrets.SECRET_HEADER_NAME }}
          SECRET_HEADER_KEY: ${{ secrets.SECRET_HEADER_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TYPE: ${{ secrets.TYPE }} 
          PROJECT_ID: ${{ secrets.PROJECT_ID }} 
          PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }} 
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }} 
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }} 
          CLIENT_ID: ${{ secrets.CLIENT_ID }} 
          AUTH_URI: ${{ secrets.AUTH_URI }} 
          TOKEN_URI: ${{ secrets.TOKEN_URI }} 
          AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }} 
          CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }} 
          UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GCS_SIGNED_URL_EXPIRATION: ${{ secrets.GCS_SIGNED_URL_EXPIRATION }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_PROVIDER: ${{ secrets.AGENT_PROVIDER }}
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12" 

            - name: Install dependencies
              run: |
                  echo "=== Installing dependencies ==="
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run unit tests
              run: |
                  echo "=== Starting unit tests on branch: ${{ github.ref }} ==="
                  python -m pytest tests/units/ -v

            - name: Run integration tests
              run: |
                  echo "=== Starting integration tests on branch: ${{ github.ref }} ==="
                  python -m pytest tests/integrations/ -v
                  echo "=== Integration tests completed ==="

            - name: Final Status Check
              if: always() 
              run: echo "=== Test status is ${{ job.status }} ==="
